<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
    body {
    font-family: 'Quicksand', sans-serif;
    background-image: url('https://i.pinimg.com/1200x/b6/c0/4d/b6c04d6d77cff8b84c965bdd44defbad.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 100vh;
    color: #fdfaed;
}

#loading {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(255, 228, 240, 0.9);
    backdrop-filter: blur(12px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;

    transition: opacity 0.5s ease;
}

.loading-content {
    text-align: center;
    color: #a85c7d;
    font-weight: 600;
}

.spinner {
    width: 50px;
    height: 50px;
    border: 5px solid rgba(255, 182, 213, 0.4);
    border-top: 5px solid #ff8fc4;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 15px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.navbar {
    background: rgba(20, 40, 70, 0.6);
    backdrop-filter: blur(12px);
    padding: 12px 24px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);

    box-shadow:
        0 0 8px rgba(30, 146, 255, 0.4),
        0 0 20px rgba(30, 109, 255, 0.5);
}

.nav-logo {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
    margin-right: 20px;
    transition: 0.3s ease;
}

.nav-logo:hover {
    transform: scale(1.1);

    box-shadow:
        0 0 10px rgba(30,139,255,0.9),
        0 0 25px rgba(30,139,255,0.7);
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-self: end;
}

.nav-right a {
    font-weight: bold;
    margin-right: 18px;
    text-decoration: none;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
    transition: 0.3s ease;
}

.nav-right a:hover {
    color: #ff7eb6 !important;
    background: rgba(255,255,255,0.6);
    box-shadow: 0 0 8px rgba(255, 141, 177, 0.5);
    transform: translateY(-2px);
}

.nav-center {
    justify-self: center;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
    color: white;
    text-shadow:
        0 0 8px rgba(30,116,255,0.6),
        0 0 18px rgba(30,113,255,0.8);
}

.container-box {
    max-width: 700px;
    margin: 50px auto;
    background: rgba(255, 206, 231, 0.509);
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    animation: glowPulse 3s ease-in-out infinite;
}

@keyframes glowPulse {
    0% {
        box-shadow:
            0 0 10px rgba(251, 119, 198, 0.233),
            0 0 20px rgba(255, 120, 201, 0.412);
    }

    50% {
        box-shadow:
            0 0 18px rgba(255, 150, 209, 0.261),
            0 0 35px rgba(255, 150, 209, 0.413);
    }

    100% {
        box-shadow:
            0 0 10px rgba(255, 120, 201, 0.333),
            0 0 20px rgba(255, 120, 201, 0.385);
    }
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

kbd {
    background: linear-gradient(135deg, #ffd1ea, #ffe4f2, #ffd9ec);
    color: #744259;
    border-radius: 14px;
    padding: 8px 14px;
    font-size: 20px;
    font-weight: 700;
    font-family: 'Quicksand', sans-serif;
    box-shadow:
        0 0 10px rgba(255, 150, 210, 0.35),
        0 0 20px rgba(255, 180, 220, 0.25);
    border: 1px solid rgba(253, 160, 179, 0.4);
    backdrop-filter: blur(6px);
    transition: all 0.3s ease;
}
</style>

</head>
<body>
    <div id="loading">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Loading your space... 🌸</p>
        </div>
    </div>

    <div class="navbar">
        <div class="nav-left">
    
            <img src="#" class="nav-logo">
    
        </div>
    
        <div class="nav-center">
            MetroFare PH
        </div>
    
        <div class="nav-right">
            <a href="#">SKU Generator</a>
            <a href="#">Receipt Generator</a>
        </div>
    </div>

    <br>

    <div class="container-box">
        <h1 class="gradient">📝 My Tasks</h1>
        <p class="mt-4 text-center">
            <kbd>Total: <span id="taskCount">0</span></kbd>
        </p>
        <br>
        <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task...">
        <button class="btn btn-primary w-100 mt-3">Add Task 🌸</button>
        <br>
        
    </div>

    <script>
            window.addEventListener("load", function() {
        const loader = document.getElementById("loading");
    
        setTimeout(() => {
            loader.style.opacity = "0";
    
            setTimeout(() => {
                loader.style.display = "none";
            }, 500);
        }, 2000);
    });
    </script>
</body>
</html>
