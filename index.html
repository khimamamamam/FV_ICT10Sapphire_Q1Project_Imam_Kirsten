<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Project</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

    <style>

        body {
            font-family: Quicksand;
            background-image: linear-gradient(rgba(255, 245, 248, 0.7), rgba(255, 245, 248, 0.7)), url(https://i.pinimg.com/736x/11/21/e7/1121e735f148bba95cd8b0d5ae5dc066.jpg);
            text-align: center;
        }
    
        .menu {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 20px;
            border-radius: 15px;
        }
    
        .receipt {
            background-color: white;
            width: 350px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 15px;
        }
    
        .create {
            background: linear-gradient(135deg, #d9bfff, #f7d1ff);
            border: none;
            font-weight: bold;
            color: #5a2e3f;
            box-shadow: 0 0 10px rgba(232, 170, 255, 0.6);
            transition: all 0.2s ease;
        }

        .create:hover {
            font-weight: bold;
            color: #5a2e3f;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(166, 0, 255, 0.173),
                        0 0 30px rgba(219, 120, 255, 0.2);
        }

        .header {
            display: inline-block;
            background: linear-gradient(135deg, #c19aff, #edd1ff, #f4d1ff);
            color: #744259;
            padding: 14px 28px;
            border-radius: 18px;
            font-size: 2rem;
            font-weight: 800;
            box-shadow: 0 6px 18px rgba(209, 150, 255, 0.5);
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
        }

        h3 {
            font-weight: bold;
            color: #5a2e3f;
            background-color: #edd1ff;
        }


        .menu {
            width: 400px;
            margin: 20px 0;
            padding: 30px;
            max-width: 500px;
            padding: 30px;
            border-radius: 20px;
            animation: glowPulse 3s ease-in-out infinite;
            background: rgba(243, 205, 255, 0.221); 
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);  
            border: 2px solid rgba(255, 255, 255, 0.7);
            box-shadow: 
            0 20px 40px rgba(255, 182, 213, 0.2),
            inset 0 0 20px rgba(255, 255, 255, 0.4);   
            animation: glowPulse 3s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }   

        .receipt {
            width: 400px;
            margin: 20px 0;
            padding: 30px;
            max-width: 500px;
            padding: 30px;
            border-radius: 20px;
            animation: glowPulse 3s ease-in-out infinite;
            background: rgba(243, 205, 255, 0.221); 
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);  
            border: 2px solid rgba(255, 255, 255, 0.7);
            box-shadow: 
            0 20px 40px rgba(255, 182, 213, 0.2),
            inset 0 0 20px rgba(255, 255, 255, 0.4);   
            animation: glowPulse 3s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        } 

        @keyframes glowPulse {
            0%, 100% {
                transform: translateY(0);
                box-shadow:
                    0 0 10px rgba(205, 119, 251, 0.233),
                    0 0 20px rgba(190, 120, 255, 0.412);
            }
            50% {
                transform: translateY(-10px);
                box-shadow:
                    0 0 10px rgba(210, 120, 255, 0.333),
                    0 0 20px rgba(192, 120, 255, 0.385);
            }
        }

        .box {
            display: flex;
            justify-content: center;
            gap: 50px;
        }

        #loading {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(247, 228, 255, 0.9);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;

            transition: opacity 0.5s ease;
        }

        .loading-content {
            text-align: center;
            color: #6b5ca8;
            font-weight: 600;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(232, 182, 255, 0.4);
            border-top: 5px solid #c58fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
    </style>

<!-- css codes (especially .menu, .receipt, and loading screen) from projects during G9 along with layout enhancements from ChatGPT -->

</head>
<body>

    <div id="loading">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Loading the shop... 🍦</p>
        </div>
    </div>

    <br>

    <h1 class="header">🍦ICE CREAM SHOP🍦</h1>

    <br>
    <div class="box">

    <div class="menu">
    <h3>Flavours:</h3>
    
    <input type="checkbox" id="item1" value="120">
    <label id="item1-label">Strawberry - ₱120</label><br>
    
    <input type="checkbox" id="item2" value="150">
    <label id="item2-label">Rocky Road - ₱150</label><br>
    
    <input type="checkbox" id="item3" value="180">
    <label id="item3-label">Cookies & Cream - ₱180</label><br>
    
    <input type="checkbox" id="item4" value="168">
    <label id="item4-label">Caramel - ₱168</label><br>
    
    <input type="checkbox" id="item5" value="130">
    <label id="item5-label">Chocolate - ₱130</label><br><br>
    
    <button class="create" py-click="create_order">Create Order</button>
    </div>
    
    <div class="receipt">
    <h3>===== Receipt =====</h3>
    <br><br>
    <div id="show"></div>
    
    </div>
    </div>


    <script type="py" src="main.py"></script>

    <script>
        window.addEventListener("load", function() {
        const loader = document.getElementById("loading");
    
        setTimeout(() => {
            loader.style.opacity = "0";
    
            setTimeout(() => {
                loader.style.display = "none";
            }, 500);
        }, 2000);
    });
    </script>
   
</body>
</html>
